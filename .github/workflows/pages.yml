name: Pages

# Publishes https://saibal-roy.github.io/ on every push to main, after checking every link.
# Pull requests (including Dependabot's) run the same build and link check without deploying.
# One-time repository setting: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage only the files to publish
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          [ -d assets ] && cp -R assets _site/ || true
          # Each page lives in its own folder with an index.html (e.g. github-practices/)
          for d in */; do
            d=${d%/}
            if [ "$d" != _site ] && [ -f "$d/index.html" ]; then cp -R "$d" _site/; fi
          done

      - name: Check links, anchors and assets
        # Project sites (e.g. /docling-batch-extract/) are published from their own repositories.
        run: |
          python3 -m http.server 8080 --directory _site >/dev/null 2>&1 &
          sleep 1
          python3 scripts/check_site.py http://localhost:8080/ --no-search --ignore docling-batch-extract/

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
